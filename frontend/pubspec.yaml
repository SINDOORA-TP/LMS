name: lms_app
description: LMS - Learning Management System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Network
  http: ^1.2.0
  dio: ^5.4.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # YouTube Player
  youtube_player_flutter: ^9.0.1

  # Utils
  intl: ^0.19.0
  fluttertoast: ^8.2.10
  video_player: ^2.14.0
  youtube_explode_dart: ^3.1.0
  wakelock_plus: ^1.5.2
  freerasp: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
